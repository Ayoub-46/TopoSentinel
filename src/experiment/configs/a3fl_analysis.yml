experiment_name: 'tda_vs_a3fl_gtsrb_iid'
seed: 42
device: "cuda"
output_dir: "results"

data_params:
  dataset_name: 'gtsrb'
  root: 'data'
  download: true
  strategy: 'iid'

fl_params:
  num_clients: 20
  clients_per_round: 20 
  num_rounds: 100

training_params:
  batch_size: 32
  local_epochs: 1
  optimizer: 'sgd'
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.00
  fedprox_mu: 0.01 # Use FedProx for benign clients to stabilize updates

attack_params:
  enabled: true
  name: "a3fl"
  malicious_client_ids: [0, 1] 
  
  poison_fraction: 0.25 
  target_label: 7 
  attack_start_round: 20 
  attack_end_round: 50
  malicious_epochs: 5 
  trigger:
    name: 'a3fl'
    kwargs:
      in_channels: 3         
      image_size: [32, 32]   
      position: [28, 28]     
      size: [3, 3]
      # Hyperparameters for the trigger optimization process
      trigger_lr: 0.01
      lambda_balance: 0.1
      adv_epochs: 100
      adv_lr: 0.01
defense_params:
  enabled: true # Enable the analysis server
  name: 'bias'

  bias_metric: 'euclidean'     