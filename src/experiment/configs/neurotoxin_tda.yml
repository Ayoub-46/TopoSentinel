experiment_name: 'tda_vs_neurotoxin_gtsrb_iid'
seed: 42
device: "cuda"
output_dir: "results"

data_params:
  dataset_name: 'gtsrb'
  root: 'data'
  download: true
  strategy: 'iid'

fl_params:
  num_clients: 20
  clients_per_round: 20 
  num_rounds: 100

training_params:
  batch_size: 32
  local_epochs: 1
  optimizer: 'sgd'
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.00
  fedprox_mu: 0.01 # Use FedProx for benign clients to stabilize updates

attack_params:
  enabled: true
  name: 'neurotoxin' # Specify the Neurotoxin attack
  malicious_client_ids: [0, 1] # Example: Clients 0 and 1 are attackers
  target_label: 8
  attack_start_round: 20 # Start attack after some initial convergence
  attack_end_round: 50
  poison_fraction: 0.25 # Fraction of local data attacker poisons
  mask_k_percent: 0.05 # Neurotoxin: Mask top 5% important params (adjust as needed)

  # Trigger used by Neurotoxin for poisoning
  trigger:
    name: 'patch'
    position: [28, 28] # Bottom-right for 32x32 GTSRB
    size: [3, 3]
    color: [1.0, 1.0, 1.0] # White patch

defense_params:
  enabled: true
  name: 'tda' 
  
  # --- Topological Defense specific parameters ---
  reduction_method: 'pca'
  pca_variance_ratio: 0.95
  metric_alpha: 0.9

  # --- Parameters for Decaying Bottleneck Threshold ---
  bottleneck_initial_threshold: 0.80  # START HIGH (Tune this)
  bottleneck_decay_rate: 0.99       # Decay per round (Tune this, closer to 1 = slower decay)
  bottleneck_min_threshold: 0.02    # Floor value (Tune this)

  # --- Parameters for NN-MAD Filtering ---
  mad_threshold: 2.0             # Tune this (MAD z-score threshold)
  min_clients_for_defense: 5

