experiment_name: 'base_fl_gtsrb_iid'
seed: 42
device: "cuda"
output_dir: "results"

data_params:
  dataset_name: 'gtsrb'
  root: 'data'
  download: true
  strategy: 'iid'

fl_params:
  num_clients: 20
  clients_per_round: 20 
  num_rounds: 100

training_params:
  batch_size: 32
  local_epochs: 1
  optimizer: 'sgd'
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.00
  fedprox_mu: 0.01 

attack_params:
  enabled: false

defense_params:
  enabled: false 
