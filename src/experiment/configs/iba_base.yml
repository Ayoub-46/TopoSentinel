experiment_name: 'iba_analysis_pca'
seed: 42
num_workers: 20
device: "cuda"

data_params:
  dataset_name: 'gtsrb'
  strategy: 'iid'

  download: true
  # partition_alpha: 0.5 # Moderately non-IID data distribution

fl_params:
  num_clients: 20
  clients_per_round: 20
  num_rounds: 100

training_params:
  batch_size: 32
  local_epochs: 1
  optimizer: 'sgd'
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.00

attack_params:
  enabled: true
  name: "iba"
  # 10% of clients are malicious
  malicious_client_ids: [0, 1] 
  
  # IBA Client specific params
  poison_fraction: 0.25 # Attackers poison 70% of their local data
  target_label: 7 # Example: 'Speed limit (80km/h)' sign in GTSRB
  attack_start_round: 20 # Let the model stabilize before attacking
  attack_end_round: 50

  # IBATrigger specific params, passed as 'kwargs' to the trigger's constructor
  trigger:
    name: 'iba'
    kwargs:
      # Hyperparameters for the U-Net generator and its training
      alpha: 0.2          # Scaling factor for the perturbation
      lambda_noise: 0.01  # Weight for the stealthiness loss term
      trigger_epochs: 50   # Epochs to fine-tune the generator each round
      trigger_lr: 0.01
      
defense_params:
  enabled: false
  name: 'tda'
  
  # Dimensionality reduction settings
  reducer: 'dct'
  # Automatically select components to explain 95% of variance
  n_components: 100 
  
  # Dynamic thresholding settings
  sensitivity: 3.5      # For the static (intra-round) detector
  change_threshold: 2.0 # For the dynamic (inter-round) alarm
